###############################################
# AviSafe live video – MediaMTX
#
# RTMP(S) inn fra DJI Pilot 2 / FlightHub 2, WebRTC (WHEP) ut til nettleseren.
# Ingen omkoding, ingen opptak. All tilgangskontroll skjer i AviSafe via
# HTTP-authhook (live-video-auth).
#
# MERK: MediaMTX utvider IKKE ${...} i denne filen. Verdiene under er
# standardverdier. På Fly overstyres de med secrets som har prefiks MTX_,
# f.eks. MTX_AUTHHTTPADDRESS og MTX_WEBRTCALLOWORIGIN (se README).
###############################################

logLevel: info
logDestinations: [stdout]

# Slår av alt vi ikke bruker
api: no
metrics: no
pprof: no
playback: no
hls: no
rtsp: no
srt: no

readTimeout: 20s
writeTimeout: 20s
writeQueueSize: 512

###############################################
# Autentisering – hver publisering og avspilling spør AviSafe
###############################################
authMethod: http
authHTTPAddress: https://pmucsvrypogtttrajqxq.supabase.co/functions/v1/live-video-auth

###############################################
# RTMP inn (Fly terminerer TLS på 1936 -> 1935)
###############################################
rtmp: yes
rtmpAddress: :1935
rtmpEncryption: "no"

###############################################
# WebRTC / WHEP ut
###############################################
webrtc: yes
webrtcAddress: :8889
webrtcEncryption: "no"
webrtcAllowOrigin: "*"
webrtcLocalUDPAddress: ""
webrtcLocalTCPAddress: :8189
webrtcIPsFromInterfaces: no
# MÅ settes til Fly-appens offentlige IP via MTX_WEBRTCADDITIONALHOSTS,
# ellers feiler avspilling stille etter signalering. Hent med: fly ips list
webrtcAdditionalHosts: []

###############################################
# Stier
###############################################
pathDefaults:
  source: publisher
  record: no
  sourceOnDemand: no

paths:
  all_others:
